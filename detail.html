<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Details - ငါ့ဆိုင်</title>
    <style>
        :root {
            --bg: #0f0f1a; --surface: #1a1a2e; --surface2: #25253d; --surface3: #2d2d4a;
            --accent: #a855f7; --accent2: #ec4899; --text: #e2e8f0; --text2: #94a3b8;
            --green: #22c55e; --yellow: #eab308; --red: #ef4444; --blue: #3b82f6;
            --radius: 12px; --shadow: 0 4px 24px rgba(0,0,0,.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        
        .header { background: linear-gradient(135deg, #1a1a2e, #2d1b4e); padding: 16px 24px; border-bottom: 1px solid var(--surface3); }
        .header-inner { max-width: 1000px; margin: 0 auto; width: 100%; display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
        .logo-icon { width: 35px; height: 35px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; width: 100%; flex: 1; }
        .detail-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--surface3); overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; box-shadow: var(--shadow); }
        
        .image-section { background: #000; display: flex; align-items: center; justify-content: center; min-height: 400px; position: relative; }
        .main-img { width: 100%; height: 100%; object-fit: contain; }
        .gallery { position: absolute; bottom: 15px; left: 15px; display: flex; gap: 8px; }
        .thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; border: 2px solid transparent; cursor: pointer; opacity: 0.7; }
        .thumb.active { border-color: var(--accent); opacity: 1; }

        .info-section { padding: 40px; display: flex; flex-direction: column; gap: 20px; }
        .item-cat { color: var(--text2); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
        .item-name { font-size: 2rem; font-weight: 800; color: #fff; line-height: 1.2; }
        .item-price { font-size: 1.8rem; font-weight: 800; color: var(--green); }
        
        .spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 10px 0; }
        .spec-item label { display: block; font-size: 0.75rem; color: var(--text2); text-transform: uppercase; margin-bottom: 4px; }
        .spec-item span { font-weight: 600; color: #fff; }

        .badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; width: fit-content; }
        .badge-instock { background: rgba(34,197,94,0.1); color: var(--green); }
        .badge-preorder { background: rgba(59,130,246,0.1); color: var(--blue); }
        .badge-soldout { background: rgba(239,68,68,0.1); color: var(--red); }

        .notes-box { background: var(--surface2); padding: 20px; border-radius: 8px; border-left: 4px solid var(--accent); margin-top: 10px; }
        .notes-box label { display: block; font-size: 0.75rem; color: var(--text2); margin-bottom: 8px; text-transform: uppercase; }

        .btn { padding: 15px 30px; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; text-decoration: none; text-align: center; transition: 0.2s; font-size: 1rem; }
        .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; box-shadow: 0 4px 15px rgba(168,85,247,0.3); }
        .btn-primary:hover { transform: translateY(-2px); opacity: 0.9; }
        .btn-secondary { background: var(--surface3); color: var(--text); }

        .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--text2); text-decoration: none; margin-bottom: 20px; font-size: 0.9rem; transition: 0.2s; }
        .back-link:hover { color: var(--accent); }

        @media (max-width: 800px) {
            .detail-card { grid-template-columns: 1fr; }
            .image-section { min-height: 300px; }
            .info-section { padding: 30px; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a href="index.html" class="logo">
            <div class="logo-icon">🛍️</div>
            <h1>ငါ့ဆိုင်</h1>
        </a>
    </div>
</header>

<div class="container">
    <a href="index.html" class="back-link">← Back to Shop</a>
    
    <div id="detail-content">
        <p style="text-align:center; padding:50px;">Loading item details...</p>
    </div>
</div>

<script>
    const SHEET_URL = 'https://script.google.com/macros/s/AKfycbz5VRvpDCyFTSGvTCy3EVb1MO9DvnFJyaSVGA14aLp_GC_pnGZH5VBuxzBe16tiY30y/exec';

    async function init() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (!id) { window.location.href = 'index.html'; return; }

        try {
            const r = await fetch(SHEET_URL + '?action=list');
            const data = await r.json();
            if (data.success) {
                const item = data.items.find(i => i.id == id);
                if (item) renderDetail(item);
                else document.getElementById('detail-content').innerHTML = '<p style="text-align:center; padding:50px;">Item not found.</p>';
            }
        } catch(e) {
            document.getElementById('detail-content').innerHTML = '<p style="text-align:center; padding:50px;">Error loading data.</p>';
        }
    }

    function renderDetail(item) {
        const images = (item.image || '').split(',').filter(u => u.trim());
        const mainImg = images[0] || 'https://via.placeholder.com/600x600?text=📦';
        const badgeClass = item.type.toLowerCase().replace(' ','');

        document.title = `${item.name} - ငါ့ဆိုင်`;

        let galleryHtml = '';
        if (images.length > 1) {
            galleryHtml = `<div class="gallery">
                ${images.map((u, i) => `<img src="${u}" class="thumb ${i===0?'active':''}" onclick="changeImg('${u}', this)">`).join('')}
            </div>`;
        }

        document.getElementById('detail-content').innerHTML = `
            <div class="detail-card">
                <div class="image-section">
                    <img src="${mainImg}" id="main-display-img" class="main-img" onerror="this.src='https://via.placeholder.com/600x600?text=📦'">
                    ${galleryHtml}
                </div>
                <div class="info-section">
                    <div>
                        <div class="item-cat">${item.category || 'General'}</div>
                        <h1 class="item-name">${item.name}</h1>
                    </div>
                    
                    <div class="badge badge-${badgeClass}">${item.type}</div>
                    
                    <div class="item-price">${Number(item.price).toLocaleString()} Ks</div>
                    
                    <div class="spec-grid">
                        <div class="spec-item"><label>Color / Size</label><span>${item.color || '-'}</span></div>
                        <div class="spec-item"><label>Available Stock</label><span>${item.qty} pcs</span></div>
                    </div>

                    ${item.notes ? `
                        <div class="notes-box">
                            <label>Description / Notes</label>
                            <div style="font-size:0.9rem; color:var(--text); white-space:pre-wrap;">${item.notes}</div>
                        </div>
                    ` : ''}

                    <div style="margin-top:20px; display:flex; flex-direction:column; gap:12px;">
                        <a href="https://m.me/yourpage" class="btn btn-primary">Order via Messenger</a>
                        <a href="index.html" class="btn btn-secondary">Continue Shopping</a>
                    </div>
                </div>
            </div>
        `;
    }

    function changeImg(url, el) {
        document.getElementById('main-display-img').src = url;
        document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
    }

    init();
</script>

</body>
</html>
